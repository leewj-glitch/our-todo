<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 할 일</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffcee;--card:rgba(255,255,255,.72);--tx:#3f3a35;--sub:#9a97a6;--line:rgba(200,170,60,.16);--pri:#7c5cd6;--priBg:#e8e0fa;--priTx:#5b3fb3;--soft:rgba(255,225,110,.12);--red:#e0616b;--sh:0 6px 18px rgba(220,190,80,.16);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#26221b;--card:#302b22;--tx:#f3ebdb;--sub:#b3a994;--line:#443d2f;--soft:#4a3f2a;--priBg:#5a4034;--priTx:#ffe3d3;--red:#ff8f8f;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#26221b;--card:#302b22;--tx:#f3ebdb;--sub:#b3a994;--line:#443d2f;--soft:#4a3f2a;--priBg:#5a4034;--priTx:#ffe3d3;--red:#ff8f8f;--sh:none;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;word-break:keep-all;overflow-wrap:break-word}
button,.sm,.pri,.back,.me,.add,nav button,.seg label,.chip,.mchip,.pbtn,.dl{white-space:nowrap}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:15px;line-height:1.45}
#app{max-width:none;margin:0 auto;padding:16px clamp(18px,4vw,72px) 100px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:21px;margin:0}
h2{font-size:15px;margin:22px 0 10px}
button,input,select{font:inherit;color:var(--tx)}
.me{background:var(--card);border:0;box-shadow:var(--sh);border-radius:22px;padding:7px 14px;cursor:pointer}
.card{background:var(--card);border-radius:24px;padding:6px 16px;box-shadow:var(--sh)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:12px}
.pbtn{background:var(--c,#ffe0e8);color:#4a4550;border-radius:24px;padding:18px 8px 14px;text-align:center;font-weight:600;cursor:pointer;overflow:hidden;text-overflow:ellipsis}
.pbtn span{display:flex;width:46px;height:46px;margin:0 auto 8px;border-radius:50%;background:rgba(255,255,255,.7);align-items:center;justify-content:center;font-size:23px}
.pbtn small{display:block;color:#8a8594;font-weight:400;font-size:12px;margin-top:2px}
.todo{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child>.todo:last-child{border-bottom:0}
.todo input{width:20px;height:20px;accent-color:var(--pri);flex:none}
.tt{flex:1;min-width:0;cursor:pointer}
.tt small{display:block;color:var(--sub);font-size:12px;margin-top:2px}
.done .tt{text-decoration:line-through;opacity:.5}
.w{padding:3px 10px;border-radius:12px;color:#4a4550;font-size:12px;font-weight:600;white-space:nowrap;flex:none}
.chev{color:var(--sub);font-size:22px;width:16px;text-align:center;cursor:pointer;transition:transform .15s;flex:none}.chev.o{transform:rotate(90deg)}
.kids{margin-left:12px;padding-left:12px;border-left:2px solid var(--line)}
.dl{color:var(--pri);font-weight:600}.dl.late{color:var(--red)}
.empty{color:var(--sub);padding:14px 0;font-size:13px;text-align:center}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sm{background:var(--soft);border:0;border-radius:14px;padding:5px 11px;font-size:13px;cursor:pointer;flex:none}
.sm.arm{background:var(--red);color:#fff}
.pri{background:var(--priBg);color:var(--priTx);border:0;border-radius:16px;padding:12px 18px;font-weight:600;cursor:pointer}
.add{width:100%;margin:10px 0 4px;border:1.5px dashed var(--line);background:none;border-radius:16px;padding:10px;color:var(--sub);cursor:pointer;font-size:13px}
.back{background:none;border:0;color:var(--pri);font-weight:600;cursor:pointer;padding:4px 0;margin-bottom:6px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:24px 24px 0 0;box-shadow:0 -4px 18px rgba(220,190,80,.2);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;border:0;padding:11px 0 10px;color:var(--sub);font-size:12px;cursor:pointer}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--pri);font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;font-size:12px;color:var(--sub);padding:4px 0}
.cd{min-height:66px;background:var(--card);border-radius:12px;padding:4px;font-size:11px;overflow:hidden;cursor:pointer;border:1.5px solid transparent}
.cd.t{border-color:var(--pri)}.cd.s{background:var(--soft)}
.cd i{font-style:normal;font-size:12px;display:block}
.chip{display:block;background:var(--soft);border-radius:6px;padding:0 4px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;font-size:10px}
.chip.d{opacity:.45;text-decoration:line-through}
.mchip{display:inline-block;background:var(--soft);border-radius:14px;padding:4px 11px;margin:0 6px 6px 0;font-size:13px;cursor:pointer}
.mchip.d{opacity:.45;text-decoration:line-through}
#modal{position:fixed;inset:0;background:rgba(60,45,20,.35);display:none;align-items:flex-end;justify-content:center;z-index:10}
#modal.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.sheet label{display:block;font-size:12px;color:var(--sub);margin:14px 0 6px}
.sheet input[type=text],.sheet input[type=date],.sheet select{width:100%;padding:11px;border:0;border-radius:14px;background:var(--bg)}
.sh2{display:flex;gap:8px}.sh2 select{flex:1}
.seg{display:flex;gap:8px}
.seg label{flex:1;margin:0;text-align:center;border-radius:14px;padding:10px 0;color:var(--tx);font-size:14px;cursor:pointer;background:var(--bg)}
.seg input{display:none}.seg input:checked+span{font-weight:700}
.seg label:has(input:checked){background:var(--priBg);color:var(--priTx)}
.acts{display:flex;gap:8px;margin-top:20px}.acts .pri{flex:1}
.msg{padding:40px 10px;text-align:center;color:var(--sub)}
h1,h2,.pbtn,nav button,nav button.on,.me,.sheet b,.pri{font-family:"Jua",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-weight:400}
body{font-size:17px}h1{font-size:25px}h2{font-size:18px}
.pbtn small,.tt small{font-size:14px}.w{font-size:14px}.chev{font-size:26px}
.empty,.add,.sm,.mchip{font-size:15px}nav button{font-size:14px}nav button b{font-size:22px}
.cal .h{font-size:14px}.cd{font-size:13px;min-height:84px}.cd i{font-size:14px}.chip{font-size:12px}
.seg label{font-size:16px}.sheet label{font-size:14px}
.chip,.mchip{color:#4a4550}
.todo input[type=checkbox]{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:8px;border:2px solid #d9d4c4;background:var(--card);cursor:pointer;flex:none;position:relative}
.todo input[type=checkbox]:checked{background:var(--ck,#b9a2ee);border-color:var(--ck,#b9a2ee)}
.todo input[type=checkbox]:checked::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.seg label:has(input:checked){background:var(--wc,var(--priBg));color:#4a4550}
.tt small.memo{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;margin-top:4px}
.sheet textarea{width:100%;padding:11px;border:0;border-radius:14px;background:var(--bg);resize:vertical;font:inherit;color:var(--tx)}
@media (min-width:900px){.cd{min-height:120px}.cd i{font-size:16px}.chip{font-size:13px}.grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}}
.sheet{background:#fffdf0}
nav{background:rgba(255,255,255,.8);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sheet{background:#302b22}:root:not([data-theme="light"]) nav{background:rgba(48,43,34,.85)}}
.who3{display:flex;background:var(--card);border-radius:22px;padding:3px;box-shadow:var(--sh)}
.who3 button{border:0;background:none;padding:6px 13px;border-radius:18px;cursor:pointer;white-space:nowrap;font-family:"Jua",sans-serif}
.who3 button.on{background:var(--priBg);color:var(--priTx)}
.cb2{display:flex;flex-direction:column;gap:5px;flex:none}
.cb2 label{display:flex;align-items:center;gap:6px;cursor:pointer}
.cb2 small{font-size:12px;color:var(--sub);white-space:nowrap}
.cb2 input[type=checkbox]{width:20px;height:20px;border-radius:6px}
.cb2 input[type=checkbox]:checked::after{left:5px;top:1px;width:5px;height:10px}
.sheet select#loc{font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const WC={"우정":"#f1ecfd","길성":"#eaf8de","함께":"#e8f5fd","각자":"#f3efe4"};
const CK={"우정":"#cdbdf5","길성":"#bde6a3","함께":"#aedcf5"};
const ck=t=>CK[t.doneBy]||CK[t.who]||"#b9a2ee";
const TH={"우정":{bg:"#faf7ff",pri:"#7c5cd6",pb:"#efe9fc",pt:"#5b3fb3",soft:"rgba(160,130,235,.1)",d:["#b9a2ee","#4a3f6b","#e6dcfa"]},
"길성":{bg:"#f7fcf2",pri:"#3f9a52",pb:"#e6f6dc",pt:"#2b7a3c",soft:"rgba(130,200,100,.12)",d:["#8fd17a","#3a5033","#dff3d2"]},
"함께":{bg:"#f3faff",pri:"#3b8fd0",pb:"#e1f1fb",pt:"#276fa8",soft:"rgba(120,185,235,.12)",d:["#86c3ef","#2f4a5e","#d9ecfa"]}};
function theme(){const t=TH[me];if(!t)return;const dk=matchMedia("(prefers-color-scheme: dark)").matches,s=document.documentElement.style;
  s.setProperty("--pri",dk?t.d[0]:t.pri);s.setProperty("--priBg",dk?t.d[1]:t.pb);s.setProperty("--priTx",dk?t.d[2]:t.pt);
  if(!dk){s.setProperty("--bg",t.bg);s.setProperty("--soft",t.soft)}}
const WHO={"우정":"","길성":"","함께":"","각자":""};
const EACH=["우정","길성"];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const TODAY=ymd(new Date());
let user=null,authReady=false,denied=false,db=null,todos=[],projects=[],tab="list",proj=null,open=new Set(),cal=new Date(2026,10,1),selDay=null,armed=null,ready=false,seeded=false,me=null;
try{me=localStorage.getItem("me")}catch(e){}
const COLORS=["#fffbd9","#ffeedd","#d6f4ee","#eef7ff","#f7f2ff","#f0faf8"];
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const key=t=>t.due||(t.month?t.month+"-31":"9999");
const byKey=(a,b)=>key(a).localeCompare(key(b));
const rootP=id=>{let p=projects.find(x=>x.id===id);while(p&&p.parent)p=projects.find(x=>x.id===p.parent);return p?p.id:id};
const pName=id=>{const p=projects.find(x=>x.id===id);return p?p.name:""};
const tPath=t=>{const a=[];let p=todos.find(x=>x.id===t.parent);while(p){a.unshift(p.title);p=todos.find(x=>x.id===p.parent)}return [pName(rootP(t.projectId)),...a].join(" › ")};
const pe=t=>{const p=projects.find(x=>x.id===rootP(t.projectId));return(p&&p.emoji)||"📌"};
const dT=id=>{const r=[id];for(let i=0;i<r.length;i++)todos.forEach(t=>{if(t.parent===r[i])r.push(t.id)});return r};
const inProj=(t,pid)=>rootP(t.projectId)===pid;
function label(t){
  if(t.due){const n=Math.round((new Date(t.due+"T00:00:00")-new Date(TODAY+"T00:00:00"))/864e5);
    const txt=n===0?"오늘":n>0?"D-"+n:"D+"+(-n)+" 지남";
    return `<span class="dl ${n<0?"late":""}">${txt}</span> · ${+t.due.slice(5,7)}/${+t.due.slice(8)}`}
  if(t.month)return `<span class="dl">${+t.month.slice(5)}월 중</span>`;
  return"";
}
function cb(t){
  if(t.who==="각자")return `<span class="cb2">${EACH.map(n=>`<label><input type="checkbox" style="--ck:${CK[n]}" data-act="tog2" data-id="${t.id}" data-who="${n}" ${t.dn&&t.dn[n]?"checked":""}><small>${n}</small></label>`).join("")}</span>`;
  return `<input type="checkbox" style="--ck:${ck(t)}" data-act="tog" data-id="${t.id}" ${t.done?"checked":""}>`;
}
function locOpts(t,sel){
  const ex=t.id?dT(t.id):[];
  let h=projects.filter(p=>!p.parent).map(p=>`<option value="P|${p.id}" ${sel==="P|"+p.id?"selected":""}>${esc((p.emoji||"")+" "+p.name)} · 최상위</option>`).join("");
  const L=todos.filter(x=>!ex.includes(x.id)).map(x=>[tPath(x)+" › "+x.title,x.id]).sort((a,b)=>a[0].localeCompare(b[0]));
  return h+L.map(([p,id])=>`<option value="T|${id}" ${sel==="T|"+id?"selected":""}>${esc(p)}</option>`).join("");
}
/* flat row (임박/내가/달력) */
function flat(t){
  return `<div class="todo ${t.done?"done":""}">${cb(t)}
  <div class="tt" data-act="edit" data-id="${t.id}">${esc(t.title)}<small>${[pe(t)+" "+esc(tPath(t)),label(t)].filter(Boolean).join(" · ")}</small>${t.memo?`<small class="memo">📝 ${esc(t.memo)}</small>`:""}</div><span class="w" style="background:${WC[t.who]||"#eee"}">${esc(t.who||"")}</span></div>`;
}
const list=arr=>arr.length?`<div class="card">${arr.map(flat).join("")}</div>`:`<div class="empty">할 일이 없어요</div>`;
/* tree row (프로젝트 안) */
function node(t){
  const kids=todos.filter(x=>x.parent===t.id).sort(byKey),op=open.has(t.id);
  const sub=[label(t),kids.length?`하위 ${kids.filter(x=>x.done).length}/${kids.length}`:""].filter(Boolean).join(" · ");
  return `<div class="item"><div class="todo ${t.done?"done":""}">${cb(t)}
  <div class="tt" data-act="exp" data-id="${t.id}">${esc(t.title)}${sub?`<small>${sub}</small>`:""}${t.memo?`<small class="memo">📝 ${esc(t.memo)}</small>`:""}</div><span class="w" style="background:${WC[t.who]||"#eee"}">${esc(t.who||"")}</span><button class="sm" data-act="edit" data-id="${t.id}">⋯</button><span class="chev ${op?"o":""}" data-act="exp" data-id="${t.id}">›</span></div>`+
  (op?`<div class="kids">${kids.map(node).join("")}<button class="add" data-act="addTodo" data-id="${t.id}">+ 하위 항목</button></div>`:"")+`</div>`;
}
const delBtn=id=>`<button class="sm ${armed===id?"arm":""}" data-act="delProj" data-id="${id}">${armed===id?"정말 삭제?":"삭제"}</button>`;

function vList(){
  let h="";
  if(!proj){
    const soon=todos.filter(t=>!t.done&&(t.due||t.month)).sort(byKey).slice(0,5);
    h+=`<h2>⏰ 마감 임박</h2>`+list(soon);
    h+=`<h2>프로젝트</h2><div class="grid">`+projects.filter(p=>!p.parent).map((p,i)=>{
      const n=todos.filter(t=>!t.done&&inProj(t,p.id)).length;
      return `<div class="pbtn" style="--c:${COLORS[i%COLORS.length]}" data-act="open" data-id="${p.id}"><span>${esc(p.emoji||"📌")}</span>${esc(p.name)}<small>남은 일 ${n}</small></div>`}).join("")+`</div>`;
    return h+`<button class="add" data-act="addTop">+ 프로젝트 추가</button>`;
  }
  const p=projects.find(x=>x.id===proj);if(!p){proj=null;return vList()}
  const roots=todos.filter(t=>inProj(t,p.id)&&!t.parent).sort(byKey);
  h+=`<button class="back" data-act="back">← 전체</button><div class="row"><h2 style="margin:4px 0">${esc(p.emoji||"")} ${esc(p.name)}</h2>${delBtn(p.id)}</div>`;
  h+=`<div class="row" style="margin:14px 0 10px"><small style="color:var(--sub)">눌러서 하위 항목 보기</small><button class="sm" data-act="addTodo" data-id="">+ 할 일</button></div>`;
  return h+(roots.length?`<div class="card">${roots.map(node).join("")}</div>`:`<div class="empty">할 일을 추가해보세요</div>`);
}
function vMine(){
  const mine=todos.filter(t=>t.who==="각자"?(EACH.includes(me)&&!(t.dn&&t.dn[me])):(!t.done&&(t.who===me||t.who==="함께"))).sort(byKey);
  const g={};mine.forEach(t=>{const k=t.due?"d"+t.due:t.month?"m"+t.month:"z";(g[k]=g[k]||[]).push(t)});
  let h=`<h2>${me==="함께"?"함께 할 일":esc(me)+"의 할 일"}</h2>`;
  if(!mine.length)return h+`<div class="empty">남은 할 일이 없어요 🎉</div>`;
  Object.keys(g).sort((a,b)=>(a==="z")-(b==="z")||a.slice(1).localeCompare(b.slice(1))).forEach(k=>{
    const nm=k[0]==="d"?(()=>{const d=new Date(k.slice(1)+"T00:00:00");return `${d.getMonth()+1}월 ${d.getDate()}일 (${"일월화수목금토"[d.getDay()]})`+(k.slice(1)===TODAY?" · 오늘":"")})():k[0]==="m"?+k.slice(6)+"월 중":"날짜 미정";
    h+=`<h2>${nm}</h2>`+list(g[k]);
  });
  return h;
}
function vCal(){
  const y=cal.getFullYear(),m=cal.getMonth(),ms=y+"-"+pad(m+1);
  const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  let h=`<div class="row"><button class="sm" data-act="prev">◀</button><h2 style="margin:0">${y}년 ${m+1}월</h2><button class="sm" data-act="next">▶</button></div>`;
  const mt=todos.filter(t=>!t.due&&t.month===ms);
  h+=`<div style="margin:14px 0 6px"><small style="color:var(--sub)">📌 ${m+1}월 중</small><div style="margin-top:8px">`+
    (mt.length?mt.map(t=>`<span class="mchip ${t.done?"d":""}" style="background:${WC[t.who]}" data-act="edit" data-id="${t.id}">${pe(t)} ${esc(t.title)}</span>`).join(""):`<span class="empty" style="padding:0">없음</span>`)+`</div></div>`;
  h+=`<div class="cal">`+"일월화수목금토".split("").map(d=>`<div class="h">${d}</div>`).join("");
  for(let i=0;i<first;i++)h+=`<div></div>`;
  for(let d=1;d<=days;d++){
    const ds=ms+"-"+pad(d),ts=todos.filter(t=>t.due===ds);
    h+=`<div class="cd ${ds===TODAY?"t":""} ${ds===selDay?"s":""}" data-act="day" data-id="${ds}"><i>${d}</i>`+
      ts.slice(0,2).map(t=>`<span class="chip ${t.done?"d":""}" style="background:${WC[t.who]}">${pe(t)} ${esc(t.title)}</span>`).join("")+(ts.length>2?`<span class="chip">+${ts.length-2}</span>`:"")+`</div>`;
  }
  h+=`</div>`;
  if(selDay){const d=new Date(selDay+"T00:00:00");h+=`<h2>${d.getMonth()+1}월 ${d.getDate()}일</h2>`+list(todos.filter(t=>t.due===selDay));}
  return h;
}
function render(){theme();
  if(!authReady){$("#app").innerHTML=`<div class="msg">불러오는 중…</div>`;$("#nav").innerHTML="";return}
  if(!user){$("#app").innerHTML=`<div class="msg"><h1>🏡 우리 할 일</h1><p>구글 계정으로 로그인해 주세요</p><button class="pri" data-act="login">Google로 로그인</button></div>`;$("#nav").innerHTML="";return}
  if(denied){$("#app").innerHTML=`<div class="msg"><h1>접근할 수 없어요</h1><p>${esc(user.email)} 계정은 허용되지 않았어요.</p><button class="pri" data-act="logout">다른 계정으로 로그인</button></div>`;$("#nav").innerHTML="";return}
  if(!me){$("#app").innerHTML=`<div class="msg"><h1>누구세요? 👋</h1><p>이 기기에서 사용할 이름을 골라주세요</p><div class="seg" style="max-width:300px;margin:0 auto">`+
    ["우정","길성","함께"].map(n=>`<label data-act="setme" data-id="${n}">${n}</label>`).join("")+`</div></div>`;$("#nav").innerHTML="";return}
  $("#nav").innerHTML=[["list","📝","투두리스트"],["mine","✅","내가 할 일"],["cal","📅","달력"]].map(([k,i,n])=>`<button class="${tab===k?"on":""}" data-act="tab" data-id="${k}"><b>${i}</b>${n}</button>`).join("");
  let body=!ready?`<div class="msg">불러오는 중…</div>`:tab==="list"?vList():tab==="mine"?vMine():vCal();
  if(db===false)body=`<div class="msg">저장소에 연결할 수 없어요.<br>claude.ai에 로그인 후 다시 열어주세요.</div>`;
  $("#app").innerHTML=`<header><h1>🏡 우리 할 일</h1><div class="who3">${["우정","길성","함께"].map(n=>`<button class="${n===me?"on":""}" data-act="setme" data-id="${n}">${n}</button>`).join("")}</div></header>`+body+(tab==="list"&&!proj&&ready?`<div style="text-align:center;margin-top:28px"><button class="sm" data-act="logout">로그아웃 (${esc(user.email)})</button></div>`:"");
}
/* modal */
function openModal(html,onSave,onDel){
  $("#sheet").innerHTML=html+`<div class="acts">${onDel?`<button class="sm" id="mdel" style="color:var(--red)">삭제</button>`:""}<button class="sm" id="mx">취소</button><button class="pri" id="ms">저장</button></div>`;
  $("#modal").classList.add("open");
  $("#mx").onclick=closeModal;
  $("#ms").onclick=()=>{if(onSave()!==false)closeModal()};
  if(onDel)$("#mdel").onclick=()=>{onDel();closeModal()};
  const f=$("#sheet input[type=text]");if(f)f.focus();
}
const closeModal=()=>$("#modal").classList.remove("open");
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
function nameModal(title,onOk){
  openModal(`<b>${title}</b><label>이름</label><input type="text" id="nm" maxlength="30"><label>이모지 (선택)</label><input type="text" id="em" maxlength="2">`,()=>{
    const v=$("#nm").value.trim();if(!v)return false;onOk(v,$("#em").value.trim())});
}
function todoModal(pid,t,parent){
  const isNew=!t;t=t||{title:"",who:me,projectId:pid,due:"",month:""};
  const sel=isNew?(parent?"T|"+parent:"P|"+rootP(pid)):(t.parent?"T|"+t.parent:"P|"+rootP(t.projectId));
  const dt=t.due?"d":t.month?"m":"n",mv=t.month||"2026-11",my=+mv.slice(0,4),mm=+mv.slice(5);
  const yrs=[2026,2027,2028],yo=yrs.includes(my)?yrs:[my,...yrs];
  openModal(`<b>${isNew?(parent?"하위 항목 추가":"할 일 추가"):"할 일 수정"}</b><label>할 일</label><input type="text" id="tt" value="${esc(t.title)}">
  <label>누가?</label><div class="seg">${Object.keys(WHO).map(n=>`<label style="--wc:${WC[n]}"><input type="radio" name="who" value="${n}" ${t.who===n?"checked":""}><span>${n}</span></label>`).join("")}</div>
  <label>마감</label><select id="dt"><option value="n" ${dt==="n"?"selected":""}>없음</option><option value="d" ${dt==="d"?"selected":""}>정확한 날짜</option><option value="m" ${dt==="m"?"selected":""}>○월 중</option></select>
  <input type="date" id="dd" value="${t.due||"2026-11-01"}" style="margin-top:8px">
  <div class="sh2" id="mw" style="margin-top:8px"><select id="my">${yo.map(y=>`<option value="${y}" ${y===my?"selected":""}>${y}년</option>`).join("")}</select><select id="mo">${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${i+1===mm?"selected":""}>${i+1}월 중</option>`).join("")}</select></div>
  <label>메모</label><textarea id="memo" rows="3" placeholder="방법, 장소, 시간 등을 적어두세요">${esc(t.memo||"")}</textarea>
  <label>위치 (다른 할 일 아래로 옮기기)</label><select id="loc">${locOpts(t,sel)}</select>`,
  ()=>{
    const title=$("#tt").value.trim();if(!title)return false;
    const k=$("#dt").value,o={title,who:document.querySelector('input[name=who]:checked').value,projectId:t.projectId,
      due:k==="d"?$("#dd").value:"",month:k==="m"?$("#my").value+"-"+pad($("#mo").value):"",memo:$("#memo").value.trim()};
    if(k==="d"&&!o.due)return false;
    const lv=$("#loc").value.split("|");let np="";
    if(lv[0]==="P"){o.projectId=lv[1]}else{const x=todos.find(z=>z.id===lv[1]);np=lv[1];if(x)o.projectId=x.projectId}
    if(o.who==="각자"){o.dn=t.dn||{};o.done=EACH.every(n=>o.dn[n])}
    if(isNew)save("todos",uid("t"),{done:false,dn:{},created:Date.now(),...o,parent:np});
    else{save("todos",t.id,{...t,...o,parent:np});if(o.projectId!==t.projectId)dT(t.id).slice(1).forEach(i=>db.collection("todos").doc(i).update({projectId:o.projectId}))}
    if(np)open.add(np);
  },isNew?null:()=>dT(t.id).forEach(i=>db.collection("todos").doc(i).delete()));
  const sync=()=>{const k=$("#dt").value;$("#dd").style.display=k==="d"?"":"none";$("#mw").style.display=k==="m"?"":"none"};
  $("#dt").onchange=sync;sync();
}
const save=(c,id,o)=>{const x={...o};delete x.id;return db.collection(c).doc(id).set(x).catch(console.error)};
/* events */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el||el.closest("#modal"))return;
  const a=el.dataset.act,id=el.dataset.id;
  if(a!=="delProj"&&armed)armed=null;
  if(a==="setme"){me=id;try{localStorage.setItem("me",me)}catch(x){}}
  else if(a==="switch"){me=me==="우정"?"길성":"우정";try{localStorage.setItem("me",me)}catch(x){}}
  else if(a==="login"){const pv=new firebase.auth.GoogleAuthProvider();auth.signInWithPopup(pv).catch(e=>{console.error(e);if(e.code==="auth/popup-blocked")auth.signInWithRedirect(pv)});return}
  else if(a==="logout"){auth.signOut();return}
  else if(a==="tab"){tab=id;proj=null}
  else if(a==="open")proj=id;
  else if(a==="back")proj=null;
  else if(a==="exp"){open.has(id)?open.delete(id):open.add(id)}
  else if(a==="prev")cal.setMonth(cal.getMonth()-1);
  else if(a==="next")cal.setMonth(cal.getMonth()+1);
  else if(a==="day")selDay=selDay===id?null:id;
  else if(a==="tog2"){const t=todos.find(x=>x.id===id);if(t){t.dn={...(t.dn||{}),[el.dataset.who]:el.checked};t.done=EACH.every(n=>t.dn[n]);save("todos",id,t)}return}
  else if(a==="tog"){const t=todos.find(x=>x.id===id);if(t){t.done=el.checked;t.doneBy=t.done?me:"";save("todos",id,t)}return}
  else if(a==="edit"){todoModal(null,todos.find(x=>x.id===id));return}
  else if(a==="addTodo"){if(id)open.add(id);todoModal(proj,null,id||"");return}
  else if(a==="addTop"){nameModal("프로젝트 추가",(v,em)=>save("projects",uid("p"),{name:v,emoji:em||"📌",parent:"",order:Date.now()}));return}
  else if(a==="delProj"){
    if(armed!==id){armed=id;render();return}
    armed=null;const ps=projects.filter(p=>rootP(p.id)===id).map(p=>p.id);
    todos.filter(t=>ps.includes(t.projectId)).forEach(t=>db.collection("todos").doc(t.id).delete());
    ps.forEach(i=>db.collection("projects").doc(i).delete());proj=null;return;
  }
  render();
});
